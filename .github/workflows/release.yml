name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Embed app icon
        shell: pwsh
        run: ./scripts/set-exe-icon.ps1 target/x86_64-pc-windows-gnu/release/tempmanager.exe assets/tempmanager.ico

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\tempmanager.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target\x86_64-pc-windows-gnu\release\tempmanager.exe dist\tempmanager.exe
          Get-FileHash dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            "dist\tempmanager-setup-$version.exe" dist\tempmanager.exe dist\SHA256SUMS.txt `
            --title "tempmanager $version" --generate-notes
