[package]
name    = "tempmanager"
version = "0.1.0"
edition = "2021"
build   = "build.rs"

[dependencies.windows-sys]
version  = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]

# Everything below is in service of "not noticeable in background tasks".
[profile.release]
opt-level     = 3        # speed on the sample path; size is handled by lto+strip
lto           = "fat"    # cross-crate inlining, dead-code elimination
codegen-units = 1        # best optimisation, slower builds (we don't care)
panic         = "abort"  # no unwind tables -> smaller binary, no landing pads
strip         = true     # drop symbols
overflow-checks = false
